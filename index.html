<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Fit · Reporte Diario de Ventas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #FFB612;
    --gold-light: #FFC93D;
    --gold-dim: rgba(255,182,18,0.12);
    --black: #0A0A0A;
    --surface: #FFFFFF;
    --surface-2: #F7F8FA;
    --surface-3: #F0F2F5;
    --border: #E8EAED;
    --border-soft: #F0F2F5;
    --text-primary: #0D1117;
    --text-secondary: #6B7280;
    --text-tertiary: #9CA3AF;
    --green: #10B981;
    --green-bg: #ECFDF5;
    --green-text: #065F46;
    --red: #EF4444;
    --red-bg: #FEF2F2;
    --red-text: #991B1B;
    --orange: #F59E0B;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--surface-3);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── LOGIN ─────────────────────────────────────────────────── */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #0A0A0A 0%, #1a1a2e 100%);
  }
  .login-box {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%; max-width: 380px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 24px 64px rgba(0,0,0,0.4);
  }
  .login-logo {
    background: var(--gold);
    border-radius: 10px;
    padding: 8px 16px;
    font-weight: 800; font-size: 13px; color: #000;
    letter-spacing: 0.08em;
    display: inline-block; margin-bottom: 24px;
  }
  .login-title { color: #fff; font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .login-sub { color: rgba(255,255,255,0.4); font-size: 13px; margin-bottom: 28px; }
  .login-input {
    width: 100%; padding: 13px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 15px;
    margin-bottom: 12px; outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .login-input::placeholder { color: rgba(255,255,255,0.25); }
  .login-input:focus { border-color: var(--gold); }
  .login-btn {
    width: 100%; padding: 13px;
    border-radius: var(--radius-sm);
    background: var(--gold); border: none; color: #000;
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
    letter-spacing: 0.02em;
  }
  .login-btn:hover { background: var(--gold-light); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(255,182,18,0.3); }
  .login-error { color: #fc8181; font-size: 12px; margin-top: 10px; display: none; }

  /* ── LAYOUT ─────────────────────────────────────────────────── */
  #dashboard { display: none; }
  .page { max-width: 1400px; margin: 0 auto; padding: 24px 24px 48px; }
  body { min-width: 960px; }

  /* ── HEADER ─────────────────────────────────────────────────── */
  .header {
    background: var(--black);
    border-radius: var(--radius-lg);
    padding: 20px 28px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
    box-shadow: var(--shadow-md);
  }
  .header-left { display: flex; align-items: center; gap: 20px; }
  .logo {
    background: var(--gold);
    border-radius: var(--radius-sm);
    padding: 7px 13px;
    font-weight: 800; font-size: 12px; color: #000;
    letter-spacing: 0.08em; white-space: nowrap;
  }
  .header-title { color: #fff; font-size: 18px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; }
  .header-date { color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 3px; font-weight: 400; }
  .header-meta { text-align: right; }
  .header-meta-label { color: rgba(255,255,255,0.4); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; }
  .header-meta-val { color: var(--gold); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin-top: 2px; }
  #header-mes-pct { font-size: 12px; margin-top: 2px; font-weight: 500; }

  /* ── TABS ───────────────────────────────────────────────────── */
  .tabs {
    display: flex; gap: 6px; margin-bottom: 20px;
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 4px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    width: fit-content;
  }
  .tab-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; cursor: pointer;
    border: none; background: transparent; color: var(--text-secondary);
    transition: all 0.15s; font-family: inherit;
  }
  .tab-btn .code { font-size: 10px; font-weight: 700; opacity: 0.5; }
  .tab-btn.active { background: var(--gold); color: #000; box-shadow: var(--shadow-sm); }
  .tab-btn:hover:not(.active) { background: var(--surface-2); color: var(--text-primary); }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── SECTION LABEL ──────────────────────────────────────────── */
  .section-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-tertiary);
    margin-bottom: 10px; padding-left: 2px;
  }

  /* ── KPI CARDS ──────────────────────────────────────────────── */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
  .kpi-card {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s;
    position: relative; overflow: hidden;
  }
  .kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--border);
    border-radius: var(--radius-md) var(--radius-md) 0 0;
  }
  .kpi-card.dark { background: var(--black); border-color: var(--black); }
  .kpi-card.dark::before { background: var(--gold); }
  .kpi-card.good::before { background: var(--green); }
  .kpi-card.bad::before { background: var(--red); }
  .kpi-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.07em;
    color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 10px;
    display: flex; align-items: center; gap: 5px;
  }
  .kpi-card.dark .kpi-label { color: rgba(255,255,255,0.35); }
  .kpi-val { font-size: 28px; font-weight: 800; color: var(--text-primary); line-height: 1; letter-spacing: -0.02em; }
  .kpi-card.dark .kpi-val { color: var(--gold); }
  .kpi-sub { font-size: 12px; margin-top: 6px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
  .kpi-sub.red { color: var(--red); } .kpi-sub.green { color: var(--green); } .kpi-sub.gray { color: var(--text-tertiary); }

  /* ── PROGRESS ───────────────────────────────────────────────── */
  .progress-section {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    margin-bottom: 12px;
  }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .progress-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .progress-pct { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
  .progress-pct.green { color: var(--green); } .progress-pct.red { color: var(--red); }
  .progress-bar { height: 8px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
  .fill-green { background: linear-gradient(90deg, #10B981, #34D399); }
  .fill-red { background: linear-gradient(90deg, #EF4444, #F87171); }

  /* ── COMPARE CARDS ──────────────────────────────────────────── */
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .compare-card {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .compare-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.07em;
    color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 10px;
  }
  .compare-main { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .compare-pct { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .compare-pct.green { color: var(--green); } .compare-pct.red { color: var(--red); }
  .compare-badge {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 10px; border-radius: 99px;
    font-size: 11px; font-weight: 700;
  }
  .badge-green { background: var(--green-bg); color: var(--green-text); }
  .badge-red { background: var(--red-bg); color: var(--red-text); }
  .compare-detail { font-size: 12px; color: var(--text-tertiary); font-weight: 400; }

  /* ── CHART CARD ─────────────────────────────────────────────── */
  .chart-card {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 20px 22px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    margin-bottom: 12px;
  }
  .chart-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
    color: var(--text-primary); text-transform: uppercase; margin-bottom: 14px;
  }
  .chart-legend { display: flex; gap: 16px; margin-bottom: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  .legend-dot-gold { width: 16px; height: 3px; border-radius: 99px; background: var(--gold); }
  .legend-dot-green { width: 12px; height: 12px; border-radius: 3px; background: #10B981; }
  .chart-wrap { position: relative; width: 100%; height: 420px; }
  .chart-insight {
    margin-top: 14px; padding: 12px 16px;
    background: var(--surface-2); border-radius: var(--radius-sm);
    border-left: 3px solid var(--gold);
  }
  .chart-insight-label { font-size: 10px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
  .chart-insight-text { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

  /* ── CANAL TABLE ────────────────────────────────────────────── */
  .canal-card {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 20px 22px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    margin-bottom: 12px;
  }
  .canal-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
    color: var(--text-primary); text-transform: uppercase; margin-bottom: 14px;
  }
  .canal-table { width: 100%; border-collapse: collapse; }
  .canal-table thead th {
    font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--text-tertiary); text-transform: uppercase;
    padding: 0 10px 10px; border-bottom: 1px solid var(--border); text-align: left;
  }
  .canal-table thead th:not(:first-child) { text-align: right; }
  .canal-table tbody td { padding: 10px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  .canal-table tbody tr:last-child td { border-bottom: none; }
  .canal-table tbody tr:hover td { background: var(--surface-2); }
  .canal-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .canal-bar-col { width: 35%; }
  .bar-bg { background: var(--surface-3); border-radius: 99px; height: 6px; overflow: hidden; }
  .bar-fill { height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--gold-light)); }
  .canal-num { font-size: 13px; font-weight: 700; color: var(--text-primary); text-align: right; white-space: nowrap; }
  .canal-pct { font-size: 12px; color: var(--text-tertiary); text-align: right; }
  .canal-var { font-size: 12px; font-weight: 600; text-align: right; white-space: nowrap; }
  .canal-var.up { color: var(--green); } .canal-var.down { color: var(--red); }

  /* ── ALERTS ─────────────────────────────────────────────────── */
  .alert-card {
    border-radius: var(--radius-sm);
    padding: 14px 18px; margin-bottom: 8px;
    border: 1px solid #FECACA;
    background: var(--red-bg);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .alert-dot-big { width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-top: 4px; flex-shrink: 0; }
  .alert-text { font-size: 13px; color: #374151; font-weight: 500; line-height: 1.5; }
  .alert-text strong { color: var(--red-text); }

  /* ── SEDES TABLE ────────────────────────────────────────────── */
  .sedes-card {
    border: 1px solid #FECACA;
    border-radius: var(--radius-md); overflow: hidden; margin-top: 8px; margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
  }
  .sedes-hdr {
    background: var(--red-bg); padding: 12px 18px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid #FECACA;
  }
  .sedes-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
  .sedes-ttl { font-size: 11px; font-weight: 700; color: var(--red-text); text-transform: uppercase; letter-spacing: 0.07em; }
  .sedes-table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--surface); }
  .sedes-table thead th {
    font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase;
    padding: 8px 14px; border-bottom: 1px solid var(--border); text-align: left; background: var(--surface-2);
  }
  .sedes-table thead th:not(:first-child) { text-align: right; }
  .sedes-table tbody td { padding: 9px 14px; border-bottom: 1px solid var(--border-soft); }
  .sedes-table tbody tr:last-child td { border-bottom: none; }
  .sedes-table tbody tr:hover td { background: var(--surface-2); }
  .sedes-table td:not(:first-child) { text-align: right; }

  /* ── FOOTER ─────────────────────────────────────────────────── */
  .footer { text-align: center; margin-top: 32px; font-size: 11px; color: var(--text-tertiary); font-weight: 400; }

  /* ── BASE DE CLIENTES ───────────────────────────────────────── */
  .bc-section-header {
    display: flex; align-items: center; gap: 12px;
    margin: 32px 0 16px;
  }
  .bc-section-title {
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-primary);
    white-space: nowrap;
  }
  .bc-section-line { flex: 1; height: 1px; background: var(--border); }
  .bc-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
  .bc-kpi {
    background: var(--surface);
    border-radius: var(--radius-md); padding: 18px 20px;
    border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    position: relative; overflow: hidden;
  }
  .bc-kpi::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--border);
    border-radius: var(--radius-md) var(--radius-md) 0 0;
  }
  .bc-kpi.accent { background: var(--black); border-color: var(--black); }
  .bc-kpi.accent::before { background: var(--gold); }
  .bc-kpi.good::before { background: var(--green); }
  .bc-kpi.bad::before { background: var(--red); }
  .bc-kpi-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.07em;
    color: var(--text-primary); text-transform: uppercase; margin-bottom: 10px;
  }
  .bc-kpi.accent .bc-kpi-label { color: rgba(255,255,255,0.35); }
  .bc-kpi-val { font-size: 26px; font-weight: 800; color: var(--text-primary); line-height: 1; letter-spacing: -0.02em; }
  .bc-kpi.accent .bc-kpi-val { color: var(--gold); }
  .bc-kpi-delta { font-size: 12px; font-weight: 600; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
  .bc-kpi-delta.up { color: var(--green); }
  .bc-kpi-delta.down { color: var(--red); }
  .bc-kpi-delta.neutral { color: var(--text-tertiary); }
  .bc-charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .bc-chart-card {
    background: var(--surface);
    border-radius: var(--radius-md); padding: 20px 22px;
    border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .bc-chart-title {
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
    color: var(--text-primary); text-transform: uppercase; margin-bottom: 14px;
  }
  .bc-chart-wrap { position: relative; width: 100%; height: 240px; }
  .bc-badges-caption { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; color: var(--text-tertiary); text-transform: uppercase; text-align: center; margin-bottom: 6px; }
  .bc-badges-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .bc-badge { font-size: 11px; font-weight: 600; border-radius: 99px; padding: 3px 12px; border: 1px solid; text-align: center; white-space: nowrap; }
  .bc-table-card { background: var(--surface); border-radius: var(--radius-md); padding: 20px 22px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); margin-bottom: 12px; }
  .bc-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .bc-table thead th { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: var(--text-tertiary); text-transform: uppercase; padding: 0 10px 10px; border-bottom: 1px solid var(--border); text-align: right; }
  .bc-table thead th:first-child { text-align: left; }
  .bc-table tbody td { padding: 9px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  .bc-table tbody tr:last-child td { border-bottom: none; }
  .bc-table tbody tr:hover td { background: var(--surface-2); }
  .bc-table td:not(:first-child) { text-align: right; }
  .bc-tipo-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .bc-alert { border-radius: var(--radius-sm); padding: 13px 16px; margin-bottom: 10px; border: 1px solid #FECACA; background: var(--red-bg); display: flex; align-items: flex-start; gap: 10px; }
  .bc-insight {
    margin-top: 12px; padding: 10px 14px;
    background: var(--surface-2); border-radius: var(--radius-sm);
    border-left: 3px solid var(--gold);
    font-size: 12px; color: var(--text-secondary); line-height: 1.5;
  }
</style>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">SMART FIT</div>
    <div class="login-title">Reporte Diario de Ventas</div>
    <div class="login-sub">Ingresa la contraseña para continuar</div>
    <input class="login-input" type="password" id="pwd-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter') checkPwd()">
    <button class="login-btn" onclick="checkPwd()">Ingresar</button>
    <div class="login-error" id="pwd-error">Contraseña incorrecta. Intenta de nuevo.</div>
  </div>
</div>

<!-- DASHBOARD (oculto hasta ingresar contraseña) -->
<div id="dashboard">
<div class="page">
  <div class="header">
    <div class="header-left">
      <div class="logo">SMART FIT</div>
      <div>
        <div class="header-title">Reporte Diario de Ventas</div>
        <div class="header-date">Datos del 1 al 20 de August 2026</div>
      </div>
    </div>
    <div class="header-meta">
      <div class="header-meta-label">Meta del mes</div>
      <div class="header-meta-val" id="header-meta-mes">58,644</div>
      <div id="header-mes-pct" style="font-size:13px;color:#aaa;margin-top:2px;text-align:right;"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('col')" id="tab-btn-col"><span class="code">CO</span> Colombia</button>
    <button class="tab-btn" onclick="showTab('cri')" id="tab-btn-cri"><span class="code">CR</span> Costa Rica</button>
    <button class="tab-btn" onclick="showTab('pan')" id="tab-btn-pan"><span class="code">PA</span> Panamá</button>
    <button class="tab-btn" onclick="showTab('per')" id="tab-btn-per"><span class="code">PE</span> Perú</button>
  </div>

  <div id="panel-col" class="panel active"></div>
  <div id="panel-cri" class="panel"></div>
  <div id="panel-pan" class="panel"></div>
  <div id="panel-per" class="panel"></div>

  <div class="footer">Smart Fit · Datos al 20 Aug 2026 · Carga 21/08/2026</div>
</div>

function buildAlerts(c) {
  const alerts = [];
  const cum = c.acum_meta > 0 ? c.acum_ventas / c.acum_meta * 100 : 0;
  if (cum < 80) alerts.push(`Cumplimiento acumulado MTD: <strong>${cum.toFixed(1)}%</strong> — por debajo del umbral mínimo (80%).`);
  const vsP = c.prev_ventas > 0 ? (c.acum_ventas - c.prev_ventas) / c.prev_ventas * 100 : 0;
  if (vsP < -15) alerts.push(`Caída vs mes anterior: <strong>${vsP.toFixed(1)}%</strong> — supera umbral −15%.`);
  const vsPY = c.py_ventas > 0 ? (c.acum_ventas - c.py_ventas) / c.py_ventas * 100 : 0;
  if (vsPY < -5) alerts.push(`Caída vs año anterior: <strong>${vsPY.toFixed(1)}%</strong> — supera umbral −5%.`);
  c.canales.forEach(cn => {
    if (cn.p > 0) {
      const chg = (cn.a - cn.p) / cn.p * 100;
      if (chg < -15) alerts.push(`Canal <strong>${cn.n}</strong> cayó <strong>${chg.toFixed(1)}%</strong> vs mes anterior.`);
    }
  });
  if (c.sedes_sin.length > 0) alerts.push(`<strong>Sede(s) sin ventas (últimos 3 días):</strong> ${c.sedes_sin.join(', ')}. Verificar operación.`);
  return alerts;
}

        </div>
        ${bc.meta_can_hoy > 0 ? `<div style="margin-top:4px;font-size:15px;color:#111;font-weight:400;">
          <span style="font-weight:700;">Meta ≤</span> ${N(bc.meta_can_hoy)} &nbsp;·&nbsp; ${bc.cumpl_can_pct <= 100 ? '✅' : '🔴'} ${bc.cumpl_can_pct}%
        </div>` : ''}
      </div>
      <div class="bc-kpi">
        <div class="bc-kpi-label">Inadimplentes</div>
        <div class="bc-kpi-val" style="color:#e53e3e">${N(bc.inadimplentes_hoy)}</div>
        ${bc.meta_ina_hoy > 0 ? `<div style="margin-top:8px;font-size:15px;color:#111;font-weight:400;">
          <span style="font-weight:700;">Meta ≤</span> ${N(bc.meta_ina_hoy)}
        </div>` : ''}
      </div>
      <div class="bc-kpi">
        <div class="bc-kpi-label">LTR · ${c.nombre}</div>
        <div class="bc-kpi-val" style="color:#111">${bc.ltr_hoy.toFixed(2)}%</div>
      </div>
    </div>

    <!-- Gráficos históricos: activos (izq) | cancelados + tabla (der) -->
    <div class="bc-charts-grid">
      <div class="bc-chart-card">
        <div class="bc-chart-title">Activos</div>
        <div class="bc-badges-caption" id="bc-badges-cap-act-${key}" style="display:none">Cumplimiento</div>
        <div class="bc-badges-row" id="bc-badges-act-${key}"></div>
        <div class="bc-chart-wrap"><canvas id="bc-chart-act-${key}"></canvas></div>
      </div>
      <div class="bc-chart-card" style="display:flex;flex-direction:column">
        <div class="bc-chart-title">Cancelados</div>
        <div class="bc-badges-caption" id="bc-badges-cap-can-${key}" style="display:none">Churn %</div>
        <div class="bc-badges-row" id="bc-badges-can-${key}"></div>
        <div class="bc-chart-wrap" style="height:180px"><canvas id="bc-chart-can-${key}"></canvas></div>
        ${Object.keys(bc.can_por_tipo).length > 0 ? `
        <table class="bc-table" style="margin-top:10px">
          <thead><tr>
            <th style="text-align:left">Tipo</th>
            <th>Cantidad</th>
            <th>% del total</th>
          </tr></thead>
          <tbody>
            ${(() => {
              const colores = {'Voluntario':'#000000','Automático':'#63636B','Expulsado':'#E88D35'};
              const total = Object.values(bc.can_por_tipo).reduce((a,b)=>a+b,0);
              return Object.entries(bc.can_por_tipo).map(([tipo, val]) => {
                const pct = total > 0 ? (val/total*100).toFixed(1) : '0';
                return `<tr>
                  <td><span class="bc-tipo-dot" style="background:${colores[tipo]||'#a0aec0'}"></span>${tipo}</td>
                  <td>${N(val)}</td>
                  <td>${pct}%</td>
                </tr>`;
              }).join('') + `<tr style="font-weight:700;border-top:2px solid #f0f0f0">
                <td>Total</td>
                <td>${N(total)}</td>
                <td>100%</td>
              </tr>`;
            })()}
          </tbody>
        </table>` : ''}
      </div>
    </div>

    <!-- Gráficos históricos: inadimplentes (izq) | LTR (der) -->
    <div class="bc-charts-grid" style="margin-top:8px">
      <div class="bc-chart-card">
        <div class="bc-chart-title">Inadimplentes (% sobre activos)</div>
        <div class="bc-chart-wrap"><canvas id="bc-chart-ina-${key}"></canvas></div>
      </div>
      <div class="bc-chart-card">
        <div class="bc-chart-title">LTR · ${c.nombre} (desde Ene 2026)</div>
        <div class="bc-chart-wrap"><canvas id="bc-chart-ltr-${key}"></canvas></div>
      </div>
    </div>

    ${bc.noc_hist && bc.noc_hist.length > 0 ? `
    <div class="bc-chart-card" style="margin-top:8px;margin-bottom:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <div class="bc-chart-title" style="margin-bottom:0">No Confirmados · Histórico mensual</div>
        <div style="display:flex;gap:24px;align-items:flex-end;">
          <div>
            <div style="font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:2px;">Mes actual</div>
            <div style="font-size:22px;font-weight:800;color:var(--red);letter-spacing:-0.02em">${N(bc.noc_hoy)}</div>
          </div>
          <div>
            <div style="font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:2px;">vs mes anterior</div>
            <div style="font-size:15px;font-weight:700;color:${bc.noc_delta <= 0 ? 'var(--green)' : 'var(--red)'}">${bc.noc_delta >= 0 ? '+' : ''}${N(bc.noc_delta)} (${bc.noc_pct >= 0 ? '+' : ''}${bc.noc_pct}%)</div>
          </div>
        </div>
      </div>
      <div class="bc-chart-wrap" style="height:200px"><canvas id="bc-chart-noc-${key}"></canvas></div>
    </div>` : ''}
  `;

  if (charts[key]) { charts[key].destroy(); delete charts[key]; }
  const daily = c.daily;
  const barColors = daily.map(d => d.ventas >= d.meta ? '#10B981' : '#EF4444');

  charts[key] = new Chart(document.getElementById('chart-' + key), {
    type: 'bar',
    data: {
      labels: daily.map(d => d.date.replace(' May','').replace(' may','')),
      datasets: [
        { label: 'Ventas', data: daily.map(d => d.ventas), backgroundColor: barColors, borderRadius: 3, maxBarThickness: 80, order: 2 },
        { label: 'Meta', data: daily.map(d => d.meta), type: 'line', borderColor: '#FFB612', backgroundColor: 'transparent', borderWidth: 2, pointBackgroundColor: '#FFB612', pointRadius: 3, pointBorderColor: '#fff', pointBorderWidth: 1.5, tension: 0.3, order: 1 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 65 } },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('es-CO')}` } },
        datalabels: false
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#999', autoSkip: false, maxRotation: 0 } },
        y: { grid: { color: 'rgba(0,0,0,0.06)' }, ticks: { font: { size: 10 }, color: '#999', callback: v => v >= 1000 ? (v/1000).toFixed(0)+'k' : v } }
      }
    },
    plugins: [{
      id: 'multiLabel',
      afterDatasetsDraw(chart) {
        const ctx2 = chart.ctx;
        const meta0 = chart.getDatasetMeta(0);
        const numDays = daily.length;
        const fontSize = numDays <= 3 ? 20 : numDays <= 7 ? 15 : numDays <= 15 ? 11 : numDays <= 22 ? 8.5 : 7.5;
        const boxH    = numDays <= 3 ? 50 : numDays <= 7 ? 40 : numDays <= 15 ? 32 : numDays <= 22 ? 27 : 25;
        const minBarH = numDays <= 7 ? 30 : 18;
        meta0.data.forEach((bar, i) => {
          const d = daily[i];
          if (!d) return;
          const pct = d.meta > 0 ? Math.round(d.ventas / d.meta * 100) : 0;
          const x = bar.x, top = bar.y, bottom = bar.base, barH = bottom - top;
          ctx2.save();
          ctx2.textAlign = 'center';
          const boxW = Math.max(bar.width - 2, 28);
          const boxYraw = top - boxH - 3;
          const boxY = Math.max(boxYraw, 2);
          const boxX = x - boxW / 2;
          ctx2.fillStyle = '#fff';
          ctx2.beginPath();
          if (ctx2.roundRect) ctx2.roundRect(boxX, boxY, boxW, boxH, 3);
          else ctx2.rect(boxX, boxY, boxW, boxH);
          ctx2.fill();
          ctx2.font = `bold ${fontSize}px Inter, sans-serif`; ctx2.fillStyle = '#111';
          ctx2.fillText(d.meta.toLocaleString('es-CO'), x, boxY + boxH * 0.42);
          ctx2.font = `${fontSize - 0.5}px sans-serif`; ctx2.fillStyle = '#777';
          ctx2.fillText(pct + '%', x, boxY + boxH * 0.85);
          if (barH > minBarH) {
            ctx2.font = `bold ${fontSize}px sans-serif`; ctx2.fillStyle = 'rgba(255,255,255,0.95)';
            ctx2.fillText(d.ventas.toLocaleString('es-CO'), x, top + barH / 2 + fontSize * 0.3);
          }
          ctx2.restore();
        });
      }
    }]
  });

  // ── GRÁFICOS BASE DE CLIENTES ─────────────────────────────────────────────
  const bcChartOpts = (title) => ({
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { display: true, position: 'bottom', labels: { font: { size: 10 }, boxWidth: 10, padding: 10 } },
      tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('es-CO')}` } },
      datalabels: false
    },
    scales: {
      x: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#999', maxRotation: 0 } },
      y: { grid: { color: 'rgba(0,0,0,0.06)' }, ticks: { font: { size: 9 }, color: '#999', callback: v => v >= 1000 ? (v/1000).toFixed(0)+'k' : v } }
    }
  });

  // Destruir gráficos bc anteriores si existen
  ['act','can','ina','ltr'].forEach(t => {
    const cid = 'bc-chart-' + t + '-' + key;
    if (charts[cid]) { charts[cid].destroy(); delete charts[cid]; }
  });

  // Gráfico ACTIVOS — línea con cifras sobre cada punto + línea de meta
  const MONTH_ORD = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const actLabels = [...bc.activos_hist].sort((a,b) => MONTH_ORD.indexOf(a.label) - MONTH_ORD.indexOf(b.label)).map(p => p.label);
  const actVals   = actLabels.map(l => bc.activos_hist.find(p => p.label === l)?.value || 0);
  const actMetaVals = actLabels.map(l => (bc.meta_act_hist || []).find(p => p.label === l)?.value || 0);

  // Badges de % de cumplimiento sobre la meta, arriba del gráfico
  const actBadgesEl = document.getElementById('bc-badges-act-' + key);
  const actBadgesCapEl = document.getElementById('bc-badges-cap-act-' + key);
  if (actBadgesEl) {
    if (actMetaVals.some(v => v > 0)) {
      actBadgesCapEl.style.display = 'block';
      actBadgesEl.innerHTML = actLabels.map((l, i) => {
        const m = actMetaVals[i];
        const pct = m > 0 ? (actVals[i] / m * 100).toFixed(2) + '%' : '–';
        return `<span class="bc-badge" style="color:#B8790F;border-color:#F2C572;background:#FFF8EC">${pct}</span>`;
      }).join('');
    } else {
      actBadgesCapEl.style.display = 'none';
      actBadgesEl.innerHTML = '';
    }
  }

  charts['bc-chart-act-' + key] = new Chart(
    document.getElementById('bc-chart-act-' + key), {
      type: 'line',
      data: {
        labels: actLabels,
        datasets: [{
          label: 'Activos',
          data: actVals,
          borderColor: '#FFB612',
          backgroundColor: 'rgba(255,182,18,0.12)',
          fill: true,
          borderWidth: 2,
          pointBackgroundColor: '#FFB612',
          pointRadius: 4,
          tension: 0.3,
          datalabels: {
            anchor: 'top', align: 'top', offset: 4, clamp: true,
            font: { size: 9, weight: 'bold' },
            color: '#555',
            formatter: v => v.toLocaleString('es-CO')
          }
        },
        ...(actMetaVals.some(v => v > 0) ? [{
          label: 'Meta Activos',
          data: actMetaVals,
          borderColor: '#555',
          backgroundColor: 'transparent',
          fill: false,
          borderWidth: 1.5,
          borderDash: [4, 4],
          pointBackgroundColor: '#555',
          pointRadius: 3,
          tension: 0.3,
          datalabels: { display: false }
        }] : [])
        ]
      },
      options: {
        ...bcChartOpts('Activos'),
        layout: { padding: { top: 28, right: 20 } },
        plugins: {
          legend: { display: actMetaVals.some(v => v > 0), position: 'bottom', labels: { font: { size: 10 }, boxWidth: 10, padding: 10 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('es-CO')}` } }
        }
      }
    }
  );

  // Gráfico CANCELADOS — barras apiladas + línea de meta, colores corporativos
  const canColors = {
    'Voluntario': '#000000',
    'Automático': '#63636B',
    'Expulsado':  '#E88D35'
  };
  const MONTH_ORDER = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const canLabelsRaw = [...new Set(
    Object.values(bc.cancelados_por_tipo_hist).flatMap(serie => serie.map(p => p.label))
  )];
  const canLabelsAll = canLabelsRaw.sort((a,b) => MONTH_ORDER.indexOf(a) - MONTH_ORDER.indexOf(b));
  const canMetaByLabel = Object.fromEntries((bc.meta_can_hist || []).map(p => [p.label, p.value]));
  const canDatasets = Object.entries(bc.cancelados_por_tipo_hist).map(([tipo, serie]) => {
    const byLabel = Object.fromEntries(serie.map(p => [p.label, p.value]));
    return {
      label: tipo,
      data: canLabelsAll.map(l => byLabel[l] || 0),
      backgroundColor: canColors[tipo] || '#a0aec0',
      borderRadius: 2,
      stack: 'can',
      type: 'bar',
      datalabels: { display: false }
    };
  });
  // Agregar línea de meta cancelados si existe
  if (bc.meta_can_hoy > 0) {
    canDatasets.push({
      label: 'Meta ≤',
      data: canLabelsAll.map(l => canMetaByLabel[l] || 0),
      borderColor: '#e53e3e',
      backgroundColor: 'transparent',
      fill: false,
      borderWidth: 2,
      borderDash: [4, 4],
      pointBackgroundColor: '#e53e3e',
      pointRadius: 3,
      tension: 0.3,
      type: 'line',
      stack: undefined,
      datalabels: { display: false }
    });
  }
  // Dataset invisible para mostrar el total encima de cada barra apilada
  const canTotals = canLabelsAll.map(l => {
    return Object.entries(bc.cancelados_por_tipo_hist).reduce((sum, [tipo, serie]) => {
      const byLabel = Object.fromEntries(serie.map(p => [p.label, p.value]));
      return sum + (byLabel[l] || 0);
    }, 0);
  });
  canDatasets.push({
    label: '_totals',
    data: canTotals,
    backgroundColor: 'transparent',
    stack: 'can',
    type: 'bar',
    datalabels: {
      display: true,
      anchor: 'end', align: 'end', offset: 2, clamp: true,
      font: { size: 9, weight: 'bold' },
      color: '#333',
      formatter: v => v > 0 ? v.toLocaleString('es-CO') : ''
    }
  });
  // Badges de % de churn mensual, arriba del gráfico (reemplaza la línea en el chart)
  // Solo hasta el mes anterior (el mes en curso se deja vacío para mantener el alineado con el gráfico)
  const churnByLabel = Object.fromEntries((bc.churn_hist || []).map(p => [p.label, p.value]));
  const canBadgesEl = document.getElementById('bc-badges-can-' + key);
  const canBadgesCapEl = document.getElementById('bc-badges-cap-can-' + key);
  if (canBadgesEl) {
    const hayChurn = canLabelsAll.some(l => churnByLabel[l] != null);
    if (hayChurn) {
      canBadgesCapEl.style.display = 'block';
      canBadgesEl.style.display = 'grid';
      canBadgesEl.style.gridTemplateColumns = `repeat(${canLabelsAll.length}, 1fr)`;
      canBadgesEl.style.justifyItems = 'center';
      canBadgesEl.innerHTML = canLabelsAll.map(l => {
        const v = churnByLabel[l];
        if (v == null) return '<span></span>';
        return `<span class="bc-badge" style="color:#2b6cb0;border-color:#9DC0E8;background:#EEF5FC">${v.toFixed(2)}%</span>`;
      }).join('');
    } else {
      canBadgesCapEl.style.display = 'none';
      canBadgesEl.innerHTML = '';
    }
  }

  charts['bc-chart-can-' + key] = new Chart(
    document.getElementById('bc-chart-can-' + key), {
      type: 'bar',
      data: { labels: canLabelsAll, datasets: canDatasets },
      options: {
        ...bcChartOpts('Cancelados'),
        layout: { padding: { top: 24, right: 10 } },
        plugins: {
          legend: {
            display: true, position: 'bottom',
            labels: { font: { size: 10 }, boxWidth: 10, padding: 10,
              filter: item => item.text !== '_totals'
            }
          },
          tooltip: { callbacks: { label: ctx => {
            if (ctx.dataset.label === '_totals') return '';
            return ` ${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('es-CO')}`;
          } } },
        },
        scales: {
          x: { stacked: true, grid: { display: false }, ticks: { font: { size: 9 }, color: '#999', maxRotation: 0 } },
          y: { stacked: true, grid: { color: 'rgba(0,0,0,0.06)' }, ticks: { font: { size: 9 }, color: '#999', callback: v => v >= 1000 ? (v/1000).toFixed(0)+'k' : v } }
        }
      }
    }
  );

  // Gráfico INADIMPLENTES — línea roja con % sobre activos (no número absoluto)
  const MONTH_ORD2 = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const inaPctHist = bc.inadimplentes_pct_hist || [];
  const inaLabels = [...inaPctHist].sort((a,b) => MONTH_ORD2.indexOf(a.label) - MONTH_ORD2.indexOf(b.label)).map(p => p.label);
  const inaVals   = inaLabels.map(l => inaPctHist.find(p => p.label === l)?.value || 0);
  charts['bc-chart-ina-' + key] = new Chart(
    document.getElementById('bc-chart-ina-' + key), {
      type: 'line',
      data: {
        labels: inaLabels,
        datasets: [{
          label: '% Inadimplencia',
          data: inaVals,
          borderColor: '#e53e3e',
          backgroundColor: 'rgba(229,62,62,0.08)',
          fill: true,
          borderWidth: 2,
          pointBackgroundColor: '#e53e3e',
          pointRadius: 4,
          tension: 0.3
        }]
      },
      options: {
        ...bcChartOpts('Inadimplentes'),
        layout: { padding: { top: 28, right: 55 } },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` Inadimplencia: ${ctx.parsed.y.toFixed(2)}%` } },
          datalabels: {
            display: true,
            anchor: 'top', align: 'top', offset: 4, clamp: true,
            font: { size: 9, weight: 'bold' },
            color: '#e53e3e',
            formatter: v => v.toFixed(2) + '%'
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#999', maxRotation: 0 } },
          y: { grid: { color: 'rgba(0,0,0,0.06)' }, ticks: { font: { size: 9 }, color: '#999', callback: v => v + '%' } }
        }
      }
    }
  );

  // Gráfico LTR — Cluster Andino, desde Enero 2026, línea con cifras % sobre cada punto
  const ltrHist = bc.ltr_hist || [];
  const ltrLabels = ltrHist.map(p => p.label);
  const ltrVals   = ltrHist.map(p => p.value);
  charts['bc-chart-ltr-' + key] = new Chart(
    document.getElementById('bc-chart-ltr-' + key), {
      type: 'line',
      data: {
        labels: ltrLabels,
        datasets: [{
          label: 'LTR',
          data: ltrVals,
          borderColor: '#276749',
          backgroundColor: 'rgba(39,103,73,0.08)',
          fill: true,
          borderWidth: 2,
          pointBackgroundColor: '#276749',
          pointRadius: 4,
          tension: 0.3
        }]
      },
      options: {
        ...bcChartOpts('LTR'),
        layout: { padding: { top: 28, right: 55 } },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` LTR: ${ctx.parsed.y.toFixed(2)}%` } },
          datalabels: {
            display: true,
            anchor: 'top', align: 'top', offset: 4, clamp: true,
            font: { size: 9, weight: 'bold' },
            color: '#276749',
            formatter: v => v.toFixed(2) + '%'
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#999', maxRotation: 0 } },
          y: { grid: { color: 'rgba(0,0,0,0.06)' }, ticks: { font: { size: 9 }, color: '#999', callback: v => v + '%' } }
        }
      }
    }
  );
  // ── GRÁFICO NO CONFIRMADOS ─────────────────────────────────────────────────
  if (bc.noc_hist && bc.noc_hist.length > 0) {
    const nocId = 'bc-chart-noc-' + key;
    if (charts[nocId]) { charts[nocId].destroy(); delete charts[nocId]; }
    const nocLabels = bc.noc_hist.map(p => p.label);
    const nocVals   = bc.noc_hist.map(p => p.value);
    charts[nocId] = new Chart(document.getElementById(nocId), {
      type: 'bar',
      data: {
        labels: nocLabels,
        datasets: [{
          label: 'No Confirmados',
          data: nocVals,
          backgroundColor: nocVals.map((v, i) => i === nocVals.length - 1 ? '#6B7280' : '#D1D5DB'),
          borderColor: nocVals.map((v, i) => i === nocVals.length - 1 ? '#4B5563' : '#9CA3AF'),
          borderWidth: 1,
          borderRadius: 4,
          datalabels: {
            display: true, anchor: 'end', align: 'end', offset: 2, clamp: true,
            font: { size: 10, weight: '700', family: 'Inter' },
            color: '#111111',
            formatter: v => v.toLocaleString('es-CO')
          }
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 28 } },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ` No Confirmados: ${ctx.parsed.y.toLocaleString('es-CO')}` } }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11, family: 'Inter' }, color: '#9CA3AF', maxRotation: 0 } },
          y: { grid: { color: 'rgba(0,0,0,0.04)' }, border: { display: false },
               ticks: { font: { size: 10, family: 'Inter' }, color: '#9CA3AF', callback: v => v >= 1000 ? (v/1000).toFixed(0)+'k' : v } }
        }
      },
      plugins: [ChartDataLabels]
    });
  }
  // ── FIN GRÁFICOS BASE DE CLIENTES ─────────────────────────────────────────
}

function showTab(key) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-btn-' + key).classList.add('active');
  document.getElementById('panel-' + key).classList.add('active');
  document.getElementById('header-meta-mes').textContent = DATA[key].meta_mes.toLocaleString('es-CO');
  const mp = DATA[key].mes_pct;
  const pctEl = document.getElementById('header-mes-pct');
  pctEl.textContent = mp + '% cumpl. mes';
  pctEl.style.color = mp >= 80 ? '#4ade80' : '#fc8181';
  renderPanel(key);
}

// Tab inicial se carga después del login
</script>
</body>
</html>
