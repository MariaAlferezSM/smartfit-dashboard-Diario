<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Marca de versión: la usa el script para confirmar que Pages ya publicó el informe de hoy. -->
<meta name="preventas-build" content="20260926062814">
<!-- Evita que el navegador muestre una copia cacheada del informe de ayer. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Smart Fit · Informe de Preventas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0f0; color: #111; min-height: 100vh; }
  .page { max-width: 1180px; margin: 0 auto; padding: 24px 16px 40px; }
  .header { background: #111; border-radius: 12px; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo { background: #FFB612; border-radius: 8px; padding: 7px 12px; font-weight: 800; font-size: 13px; color: #000; letter-spacing: 0.05em; white-space: nowrap; }
  .header-title { color: #fff; font-size: 20px; font-weight: 700; line-height: 1.2; }
  .header-date { color: #aaa; font-size: 13px; margin-top: 2px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab-btn { display: flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid #ccc; background: #fff; color: #555; transition: all 0.15s; }
  .tab-btn .code { font-size: 10px; font-weight: 700; opacity: 0.6; margin-right: 2px; }
  .tab-btn.active { background: #FFB612; border-color: #FFB612; color: #000; }
  .tab-btn:hover:not(.active) { border-color: #999; color: #222; }

  .sede-pills { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .pill-btn { padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid #ddd; background: #fff; color: #666; }
  .pill-btn.active { background: #111; border-color: #111; color: #FFB612; }
  .pill-btn:hover:not(.active) { border-color: #999; color: #222; }

  .panel { display: none; }
  .panel.active { display: block; }

  .sede-title { font-size: 30px; font-weight: 800; color: #3B3B3B; margin: 4px 0 18px; }

  .kpi-row { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .kpi-card { flex: 1 1 210px; background: #000; border-radius: 14px; padding: 18px; min-width: 200px; }
  .kpi-card.single { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 104px; }
  .kpi-card.double .kpi-half { text-align: center; padding: 7px 0; }
  .kpi-card.double .divider { height: 1px; background: #8c8c8c; margin: 2px 18px; opacity: .5; }
  .kpi-label { color: #fff; font-size: 18px; }
  .kpi-value { color: #FFA500; font-size: 34px; font-weight: 800; margin-top: 4px; }

  .legend-row { display: flex; gap: 22px; align-items: center; margin-bottom: 8px; font-size: 13px; color: #333; }
  .legend-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .rango-serie { margin-left: auto; font-size: 12px; color: #777; }

  .chart-card { background: #fff; border-radius: 10px; padding: 16px 24px 8px; border: 1px solid #e8e8e8; }
  .chart-wrap { position: relative; width: 100%; height: 430px; }

  .footer { text-align: center; margin-top: 24px; font-size: 11px; color: #999; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left">
      <div class="logo">SMART FIT</div>
      <div>
        <div class="header-title">Informe de Preventas</div>
        <div class="header-date">Generado 26/09/2026 06:28</div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="mostrarPais('CO')" id="tab-btn-CO"><span class="code">CO</span> Colombia</button>
    <button class="tab-btn" onclick="mostrarPais('PA')" id="tab-btn-PA"><span class="code">PA</span> Panamá</button>
  </div>

  <div class="sede-pills" id="sede-pills"></div>

  <div id="panel-sede">
    <div class="sede-title" id="sede-title">—</div>

    <div class="kpi-row">
      <div class="kpi-card single">
        <div class="kpi-label">Ventas Totales</div>
        <div class="kpi-value" id="kpi-ventas">0</div>
      </div>
      <div class="kpi-card double">
        <div class="kpi-half">
          <div class="kpi-label">Confirmadas</div>
          <div class="kpi-value" id="kpi-confirmadas">0</div>
        </div>
        <div class="divider"></div>
        <div class="kpi-half">
          <div class="kpi-label">No Confirmados</div>
          <div class="kpi-value" id="kpi-noconfirmados">0</div>
        </div>
      </div>
      <div class="kpi-card single">
        <div class="kpi-label">Cancelados</div>
        <div class="kpi-value" id="kpi-cancelados">0</div>
      </div>
      <div class="kpi-card double">
        <div class="kpi-half">
          <div class="kpi-label">Fecha Apertura</div>
          <div class="kpi-value" id="kpi-apertura">N/D</div>
        </div>
        <div class="divider"></div>
        <div class="kpi-half">
          <div class="kpi-label">Dias Preventa</div>
          <div class="kpi-value" id="kpi-diaspreventa">N/D</div>
        </div>
      </div>
    </div>

    <div class="chart-card">
      <div class="legend-row">
        <span><span class="legend-dot" style="background:#FFA500"></span>Confirmados</span>
        <span><span class="legend-dot" style="background:#D6293E"></span>Cancelados</span>
        <span><span class="legend-dot" style="background:#1A1A1A"></span>Totales</span>
        <span class="rango-serie" id="rango-serie"></span>
      </div>
      <div class="chart-wrap">
        <canvas id="sedeChart"></canvas>
      </div>
    </div>
  </div>

  <div class="footer">Smart Fit · Informe de Preventas · últimos 30 días (o desde el primer día de venta si la sede es más nueva)</div>
</div>

<script>
const DATA = {"CO": {"nombre": "Colombia", "sedes": [{"sigla": "SCOVALJAM02", "sede": "Caña Dulce", "kpis": {"ventas_totales": 2461, "confirmadas": 1167, "no_confirmados": 15, "cancelados": 1170, "fecha_apertura": null, "dias_preventa": null}, "serie": {"labels": [["J", "27"], ["V", "28"], ["S", "29"], ["D", "30"], ["L", "31"], ["M", "1"], ["X", "2"], ["J", "3"], ["V", "4"], ["S", "5"], ["D", "6"], ["L", "7"], ["M", "8"], ["X", "9"], ["J", "10"], ["V", "11"], ["S", "12"], ["D", "13"], ["L", "14"], ["M", "15"], ["X", "16"], ["J", "17"], ["V", "18"], ["S", "19"], ["D", "20"], ["L", "21"], ["M", "22"], ["X", "23"], ["J", "24"], ["V", "25"]], "confirmados": [5, 1, 3, 1, 10, 6, 13, 7, 1, 1, 1, 12, 6, 9, 5, 3, 4, 0, 11, 4, 8, 2, 4, 2, 2, 12, 8, 14, 3, 9], "cancelados": [2, 1, 1, 2, 9, 4, 18, 11, 1, 1, 4, 5, 5, 4, 2, 12, 9, 2, 8, 18, 2, 3, 3, 0, 0, 13, 2, 7, 4, 2], "totales": [6, 1, 3, 3, 9, 8, 13, 8, 2, 4, 1, 7, 6, 9, 6, 5, 6, 1, 10, 4, 8, 5, 5, 2, 2, 14, 8, 14, 2, 10], "dias": 30, "desde": "27/08/2026", "hasta": "25/09/2026"}}, {"sigla": "SCOCUCECO01", "sede": "Ecotek", "kpis": {"ventas_totales": 4170, "confirmadas": 1676, "no_confirmados": 15, "cancelados": 2411, "fecha_apertura": null, "dias_preventa": null}, "serie": {"labels": [["J", "27"], ["V", "28"], ["S", "29"], ["D", "30"], ["L", "31"], ["M", "1"], ["X", "2"], ["J", "3"], ["V", "4"], ["S", "5"], ["D", "6"], ["L", "7"], ["M", "8"], ["X", "9"], ["J", "10"], ["V", "11"], ["S", "12"], ["D", "13"], ["L", "14"], ["M", "15"], ["X", "16"], ["J", "17"], ["V", "18"], ["S", "19"], ["D", "20"], ["L", "21"], ["M", "22"], ["X", "23"], ["J", "24"], ["V", "25"]], "confirmados": [12, 7, 6, 0, 17, 10, 11, 6, 5, 1, 2, 5, 7, 2, 10, 4, 5, 0, 8, 11, 8, 6, 2, 3, 5, 17, 8, 9, 7, 5], "cancelados": [2, 5, 0, 1, 4, 4, 12, 7, 5, 2, 1, 10, 3, 3, 1, 15, 4, 1, 6, 13, 6, 4, 2, 1, 0, 13, 2, 4, 5, 1], "totales": [11, 9, 6, 2, 17, 8, 11, 7, 7, 2, 1, 7, 6, 3, 9, 7, 3, 2, 9, 8, 9, 6, 4, 2, 6, 17, 6, 8, 8, 7], "dias": 30, "desde": "27/08/2026", "hasta": "25/09/2026"}}, {"sigla": "SCOVAIPAL02", "sede": "Metro Palmira", "kpis": {"ventas_totales": 4753, "confirmadas": 2094, "no_confirmados": 25, "cancelados": 2514, "fecha_apertura": null, "dias_preventa": null}, "serie": {"labels": [["J", "27"], ["V", "28"], ["S", "29"], ["D", "30"], ["L", "31"], ["M", "1"], ["X", "2"], ["J", "3"], ["V", "4"], ["S", "5"], ["D", "6"], ["L", "7"], ["M", "8"], ["X", "9"], ["J", "10"], ["V", "11"], ["S", "12"], ["D", "13"], ["L", "14"], ["M", "15"], ["X", "16"], ["J", "17"], ["V", "18"], ["S", "19"], ["D", "20"], ["L", "21"], ["M", "22"], ["X", "23"], ["J", "24"], ["V", "25"]], "confirmados": [5, 3, 5, 5, 12, 18, 3, 14, 11, 3, 4, 18, 9, 7, 11, 2, 5, 1, 11, 10, 7, 7, 2, 1, 1, 16, 13, 7, 6, 1], "cancelados": [5, 4, 3, 1, 8, 5, 17, 8, 5, 2, 0, 2, 2, 4, 6, 8, 9, 3, 6, 12, 7, 5, 7, 4, 0, 13, 5, 10, 8, 4], "totales": [7, 5, 5, 10, 11, 21, 3, 12, 10, 2, 5, 13, 12, 8, 10, 2, 6, 0, 10, 12, 5, 8, 3, 4, 1, 17, 13, 8, 8, 2], "dias": 30, "desde": "27/08/2026", "hasta": "25/09/2026"}}, {"sigla": "SCODCCANA01", "sede": "Restrepo", "kpis": {"ventas_totales": 4349, "confirmadas": 1688, "no_confirmados": 55, "cancelados": 2501, "fecha_apertura": null, "dias_preventa": null}, "serie": {"labels": [["J", "27"], ["V", "28"], ["S", "29"], ["D", "30"], ["L", "31"], ["M", "1"], ["X", "2"], ["J", "3"], ["V", "4"], ["S", "5"], ["D", "6"], ["L", "7"], ["M", "8"], ["X", "9"], ["J", "10"], ["V", "11"], ["S", "12"], ["D", "13"], ["L", "14"], ["M", "15"], ["X", "16"], ["J", "17"], ["V", "18"], ["S", "19"], ["D", "20"], ["L", "21"], ["M", "22"], ["X", "23"], ["J", "24"], ["V", "25"]], "confirmados": [6, 5, 3, 4, 16, 16, 9, 6, 5, 7, 2, 12, 4, 3, 8, 11, 2, 8, 6, 4, 9, 9, 3, 4, 2, 6, 12, 8, 5, 8], "cancelados": [2, 3, 3, 1, 6, 3, 14, 10, 10, 6, 0, 8, 3, 7, 2, 22, 10, 1, 1, 16, 2, 3, 2, 3, 1, 18, 4, 8, 7, 3], "totales": [7, 6, 9, 7, 13, 15, 9, 6, 5, 8, 1, 12, 7, 4, 13, 10, 2, 6, 7, 5, 11, 11, 4, 6, 2, 8, 14, 8, 7, 8], "dias": 30, "desde": "27/08/2026", "hasta": "25/09/2026"}}]}, "PA": {"nombre": "Panamá", "sedes": [{"sigla": "SPAPACATR01", "sede": "Atrio Costa del Este", "kpis": {"ventas_totales": 3410, "confirmadas": 1643, "no_confirmados": 10, "cancelados": 1731, "fecha_apertura": null, "dias_preventa": null}, "serie": {"labels": [["J", "27"], ["V", "28"], ["S", "29"], ["D", "30"], ["L", "31"], ["M", "1"], ["X", "2"], ["J", "3"], ["V", "4"], ["S", "5"], ["D", "6"], ["L", "7"], ["M", "8"], ["X", "9"], ["J", "10"], ["V", "11"], ["S", "12"], ["D", "13"], ["L", "14"], ["M", "15"], ["X", "16"], ["J", "17"], ["V", "18"], ["S", "19"], ["D", "20"], ["L", "21"], ["M", "22"], ["X", "23"], ["J", "24"], ["V", "25"]], "confirmados": [6, 6, 4, 10, 8, 3, 8, 7, 2, 1, 2, 9, 4, 1, 4, 2, 1, 2, 11, 5, 7, 6, 1, 6, 3, 7, 2, 2, 3, 3], "cancelados": [0, 0, 0, 3, 4, 2, 24, 1, 3, 2, 1, 3, 5, 0, 2, 10, 3, 2, 1, 2, 1, 4, 2, 1, 0, 8, 1, 4, 2, 2], "totales": [8, 7, 4, 9, 9, 4, 8, 6, 2, 1, 2, 8, 4, 2, 4, 3, 2, 3, 12, 6, 8, 6, 3, 5, 5, 6, 2, 3, 4, 2], "dias": 30, "desde": "27/08/2026", "hasta": "25/09/2026"}}, {"sigla": "SPAPACLAS01", "sede": "La Siesta", "kpis": {"ventas_totales": 3198, "confirmadas": 1271, "no_confirmados": 5, "cancelados": 1874, "fecha_apertura": null, "dias_preventa": null}, "serie": {"labels": [["J", "27"], ["V", "28"], ["S", "29"], ["D", "30"], ["L", "31"], ["M", "1"], ["X", "2"], ["J", "3"], ["V", "4"], ["S", "5"], ["D", "6"], ["L", "7"], ["M", "8"], ["X", "9"], ["J", "10"], ["V", "11"], ["S", "12"], ["D", "13"], ["L", "14"], ["M", "15"], ["X", "16"], ["J", "17"], ["V", "18"], ["S", "19"], ["D", "20"], ["L", "21"], ["M", "22"], ["X", "23"], ["J", "24"], ["V", "25"]], "confirmados": [4, 4, 4, 5, 7, 5, 4, 4, 2, 4, 1, 2, 3, 1, 2, 5, 0, 3, 3, 2, 6, 6, 4, 1, 2, 3, 8, 3, 2, 0], "cancelados": [0, 3, 5, 1, 6, 4, 41, 3, 0, 0, 1, 6, 2, 0, 5, 10, 6, 0, 1, 0, 1, 0, 0, 0, 0, 14, 0, 1, 3, 2], "totales": [4, 4, 4, 6, 8, 4, 4, 4, 2, 3, 1, 4, 2, 1, 2, 5, 0, 3, 3, 2, 6, 6, 4, 1, 3, 4, 7, 3, 2, 0], "dias": 30, "desde": "27/08/2026", "hasta": "25/09/2026"}}]}};
let paisActual = null;
let sedeActual = 0;
let chartInstance = null;

function N(n) { return (n ?? 0).toLocaleString('es-CO'); }

function mostrarPais(codigo) {
  paisActual = codigo;
  sedeActual = 0;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-btn-' + codigo).classList.add('active');

  const pills = document.getElementById('sede-pills');
  pills.innerHTML = '';
  DATA[codigo].sedes.forEach((s, idx) => {
    const btn = document.createElement('button');
    btn.className = 'pill-btn' + (idx === 0 ? ' active' : '');
    btn.textContent = s.sede;
    btn.onclick = () => seleccionarSede(idx);
    btn.id = 'pill-' + idx;
    pills.appendChild(btn);
  });

  renderSede();
}

function seleccionarSede(idx) {
  sedeActual = idx;
  document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pill-' + idx).classList.add('active');
  renderSede();
}

function renderSede() {
  const bloque = DATA[paisActual];
  if (!bloque || !bloque.sedes.length) return;
  const s = bloque.sedes[sedeActual];
  const k = s.kpis;

  document.getElementById('sede-title').textContent = s.sede;
  document.getElementById('kpi-ventas').textContent = N(k.ventas_totales);
  document.getElementById('kpi-confirmadas').textContent = N(k.confirmadas);
  document.getElementById('kpi-noconfirmados').textContent = N(k.no_confirmados);
  document.getElementById('kpi-cancelados').textContent = N(k.cancelados);
  document.getElementById('kpi-apertura').textContent = k.fecha_apertura || 'N/D';
  document.getElementById('kpi-diaspreventa').textContent = (k.dias_preventa === null || k.dias_preventa === undefined) ? 'N/D' : k.dias_preventa;

  // El gráfico muestra máximo 30 días, pero una sede nueva muestra solo los
  // días de venta que lleva; se indica el rango real para que no se lea como 30.
  const rango = document.getElementById('rango-serie');
  if (rango) {
    rango.textContent = s.serie.dias
      ? `${s.serie.dias} ${s.serie.dias === 1 ? 'día' : 'días'} · ${s.serie.desde} – ${s.serie.hasta}`
      : '';
  }

  renderChart(s.serie);
}

function renderChart(serie) {
  const ctx = document.getElementById('sedeChart').getContext('2d');
  if (chartInstance) { chartInstance.destroy(); }

  chartInstance = new Chart(ctx, {
    data: {
      labels: serie.labels,
      datasets: [
        {
          type: 'bar',
          label: 'Confirmados',
          data: serie.confirmados,
          backgroundColor: '#FFA500',
          borderRadius: 2,
          barPercentage: 0.9,
          categoryPercentage: 0.9,
          order: 2,
          datalabels: {
            color: '#000',
            font: { size: 13, weight: 'bold' },
            anchor: 'start',
            align: 'end',
            offset: 8,
            formatter: v => v > 0 ? v : '',
          },
        },
        {
          type: 'bar',
          label: 'Cancelados',
          data: serie.cancelados.map(v => -v),
          backgroundColor: '#D6293E',
          borderRadius: 2,
          barPercentage: 0.9,
          categoryPercentage: 0.9,
          order: 2,
          datalabels: {
            color: '#fff',
            font: { size: 11, weight: 'bold' },
            anchor: 'center',
            align: 'center',
            clamp: true,
            formatter: v => v < 0 ? v : '',
          },
        },
        {
          type: 'line',
          label: 'Totales',
          data: serie.totales,
          borderColor: '#1A1A1A',
          backgroundColor: '#1A1A1A',
          pointBackgroundColor: '#1A1A1A',
          pointRadius: 4,
          borderWidth: 2,
          tension: 0.15,
          order: 1,
          datalabels: {
            color: '#fff',
            font: { size: 10, weight: 'bold' },
            backgroundColor: '#595959',
            borderRadius: 4,
            padding: { top: 3, bottom: 3, left: 5, right: 5 },
            anchor: 'end',
            align: 'top',
            offset: 4,
          },
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: true },
        datalabels: { display: true },
      },
      layout: {
        padding: { top: 4, right: 12, bottom: 8, left: 4 },
      },
      scales: {
        x: {
          stacked: true,
          grid: { display: false },
          ticks: { font: { size: 11 }, padding: 6 },
        },
        y: { stacked: true, grid: { color: '#EDEDED' }, ticks: { color: '#595959' } },
      },
    },
    plugins: [ChartDataLabels],
  });
}

if (Object.keys(DATA).length) {
  mostrarPais(Object.keys(DATA)[0]);
}
</script>
</body>
</html>
